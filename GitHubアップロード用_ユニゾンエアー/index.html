    <!-- Tailwind CSS と Lucide Icons の読み込み (Reactは不要) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

        <!-- 画面上部：タイトルとメンバー選択 -->
        <div class="bg-white border-b border-gray-200 px-6 py-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-900">エールボーダー＆平均値チェッカー</h1>
                <p class="text-sm text-gray-500 mt-1">
                    データ更新は index.html 内の `BORDER_DATA` を直接編集してください。
                </p>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-3">
                <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 focus-within:ring-2 focus-within:ring-blue-100">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
                    <input type="text"
                           id="searchInput"
                           placeholder="メンバー検索..."
                           class="bg-transparent border-none text-sm w-32 focus:ring-0 focus:outline-none" />
                </div>
                <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
                    <i data-lucide="user" class="w-4 h-4 text-gray-500"></i>
                    <select id="memberSelect"
                            class="bg-transparent border-none text-sm font-medium w-36 focus:ring-0 focus:outline-none cursor-pointer">
                        <!-- JavaScriptで選択肢が挿入されます -->
                    </select>
                </div>
            </div>
        </div>

        <!-- データ表示テーブル -->
        <div class="p-6">
            <div id="tableContainer" class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead class="bg-gray-100 text-gray-700 font-semibold border-b border-gray-200">
                        <tr id="tableHeader">
                            <th class="px-4 py-3 border-r border-gray-200 sticky left-0 bg-gray-100 z-10 shadow-[1px_0_0_0_#e5e7eb]">
                                イベント名称
                            </th>
                            <!-- JavaScriptで順位(1位,2位...)が挿入されます -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- JavaScriptでデータが挿入されます -->
                    </tbody>
                </table>
            </div>

            <!-- データがない場合の表示 -->
            <div id="noDataMessage" class="hidden py-12 text-center text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                <p>表示するデータがありません。</p>
            </div>
        </div>
    </div>

            ],
            "小西夏菜実": [
                { eventName: "⑥5周年", "1位": 35000000, "2位": 30001003, "3位": 22524773, "4位": 20041003, "5位": 19661417, "10位": 13847611, "50位": 1926122, "100位": 1168915, "300位": 720023, "500位": 175000, "1000位": 56000, "1500位": 51016, "5000位": 10500 },
                { eventName: "⑤2024夏(日向坂)", "1位": 35524773, "2位": 30524773, "3位": 24000773, "4位": 21524773, "5位": 21500773, "10位": 9039217, "50位": 2155271, "100位": 1750000, "300位": 1062245, "500位": 464189, "1000位": 101334, "1500位": 74000, "5000位": 51000 },
                { eventName: "⑤2025夏(日向坂)", "1位": 23666666, "2位": 22524773, "3位": 19001003, "4位": 17016500, "5位": 15176621, "10位": 5213001, "50位": 1809487, "100位": 1370000, "300位": 922817, "500位": 394180, "1000位": 109050, "1500位": 87000, "5000位": 51000 }
            ]
        };
        // =========================================================

        const RANKS = ["1位", "2位", "3位", "4位", "5位", "10位", "50位", "100位", "300位", "500位", "1000位", "1500位", "5000位"];

        // HTML要素の取得
        const searchInput = document.getElementById('searchInput');
        const memberSelect = document.getElementById('memberSelect');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const tableContainer = document.getElementById('tableContainer');
        const noDataMessage = document.getElementById('noDataMessage');

        // 全メンバー名の配列（あいうえお順）
        const allMembers = Object.keys(BORDER_DATA).sort();

        // テーブルのヘッダー（順位）を生成
        RANKS.forEach(rank => {
            const th = document.createElement('th');
            th.className = "px-4 py-3 border-r border-gray-200 text-right min-w-[90px]";
            th.textContent = rank;
            tableHeader.appendChild(th);
        });

        // メンバー選択肢のプルダウンを生成・更新する関数
        function updateMemberSelect(filterText = "") {
            memberSelect.innerHTML = '<option value="" disabled>選択...</option>';

            const filtered = allMembers.filter(m => m.includes(filterText));

            filtered.forEach(member => {
                const option = document.createElement('option');
                option.value = member;
                option.textContent = member;
                memberSelect.appendChild(option);
            });

            // 検索にヒットしたメンバーがいれば、一番上の人を選択状態にする
            if (filtered.length > 0) {
                memberSelect.value = filtered[0];
                renderTable(filtered[0]);
            } else {
                renderTable("");
            }
        }

        // テーブルに数値を表示する関数
        function renderTable(memberName) {
            tableBody.innerHTML = "";

            const memberData = BORDER_DATA[memberName];

            if (!memberData || memberData.length === 0) {
                tableContainer.classList.add('hidden');
                noDataMessage.classList.remove('hidden');
                return;
            }

            tableContainer.classList.remove('hidden');
            noDataMessage.classList.add('hidden');

            // 平均値を計算するためのデータ保管庫
            const validSums = {};
            const validCounts = {};
            RANKS.forEach(r => { validSums[r] = 0; validCounts[r] = 0; });

            // 各イベントの行を作成
            memberData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100 hover:bg-gray-50 transition-colors bg-white";

                // イベント名
                const tdEvent = document.createElement('td');
                tdEvent.className = "px-4 py-3 border-r border-gray-200 font-medium text-gray-900 sticky left-0 bg-inherit shadow-[1px_0_0_0_#f3f4f6]";
                tdEvent.textContent = row.eventName;
                tr.appendChild(tdEvent);

                // 各順位の数値
                RANKS.forEach(rank => {
                    const td = document.createElement('td');
                    td.className = "px-4 py-3 border-r border-gray-100 text-right text-gray-600";

                    const val = row[rank];
                    if (val != null && !isNaN(val)) {
                        td.textContent = val.toLocaleString();
                        validSums[rank] += val;
                        validCounts[rank]++;
                    } else {
                        td.innerHTML = '<span class="text-gray-300">-</span>';
                    }
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });

            // 📊 平均値の行を作成
            const trAvg = document.createElement('tr');
            trAvg.className = "bg-blue-50 border-t-2 border-blue-200 font-bold text-blue-900";

            const tdAvgTitle = document.createElement('td');
            tdAvgTitle.className = "px-4 py-4 border-r border-blue-200 sticky left-0 bg-blue-50 shadow-[1px_0_0_0_#bfdbfe]";
            tdAvgTitle.textContent = "📊 平均値";
            trAvg.appendChild(tdAvgTitle);

            RANKS.forEach(rank => {
                const td = document.createElement('td');
                td.className = "px-4 py-4 border-r border-blue-100 text-right";

                if (validCounts[rank] > 0) {
                    const avg = validSums[rank] / validCounts[rank];
                    td.textContent = Math.round(avg).toLocaleString();
                } else {
                    td.innerHTML = '<span class="text-blue-200">-</span>';
                }
                trAvg.appendChild(td);
            });

            tableBody.appendChild(trAvg);
        }

        // --- イベントリスナー（操作に対する反応） ---

        // 検索ボックスに入力された時
        searchInput.addEventListener('input', (e) => {
            updateMemberSelect(e.target.value);
        });

        // プルダウンが変更された時
        memberSelect.addEventListener('change', (e) => {
            renderTable(e.target.value);
        });

        // --- 初期化処理 ---
        updateMemberSelect("");
        lucide.createIcons(); // アイコンの描画

    </script>
</body>
</html>
