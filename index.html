        <p class="text-sm text-gray-500 mt-1">

        </p>
      </div>

            <!-- JavaScriptで選択肢がグループ別に挿入されます -->

      </div>
    </div>

      ],
      "濱岸ひより": [
        { eventName: "②4.5周年(日向坂)", "1位": 26312000, "2位": 25270307, "3位": 20020928, "4位": 15054818, "5位": 14537572, "10位": 1000002, "50位": 51000 }

        { eventName: "④⑤2023夏", "1位": 16449020, "2位": 15000000, "3位": 12121212, "4位": 11500000, "5位": 11000000, "10位": 3781323, "50位": 1307133, "100位": 921755, "300位": 375385, "500位": 127701, "1000位": 51103, "1500位": 51000, "5000位": 8500 }
      ]
    };
    // =========================================================

    const RANKS = ["1位", "2位", "3位", "4位", "5位", "10位", "50位", "100位", "300位", "500位", "1000位", "1500位", "5000位"];
    
    // HTML要素の取得
    const searchInput = document.getElementById('searchInput');
    const memberSelect = document.getElementById('memberSelect');
    const tableHeader = document.getElementById('tableHeader');
    const tableBody = document.getElementById('tableBody');
    const tableContainer = document.getElementById('tableContainer');
    const noDataMessage = document.getElementById('noDataMessage');
    
    const aiAnalysisContainer = document.getElementById('aiAnalysisContainer');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const aiLoading = document.getElementById('aiLoading');
    const aiResultArea = document.getElementById('aiResultArea');

    // テーブルのヘッダー（順位）を生成
    RANKS.forEach(rank => {
      const th = document.createElement('th');
      th.className = "px-4 py-3 border-r border-gray-200 text-right min-w-[90px]";
      th.textContent = rank;
      tableHeader.appendChild(th);
    });

    // 指数バックオフ付きのフェッチ関数 (Gemini API用)
    async function fetchWithRetry(url, options, maxRetries = 5) {
      let delay = 1000;
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return await response.json();
        } catch (error) {
          if (i === maxRetries - 1) throw error;
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2;
        }
      }
    }

    // AIレスポンスの簡単なフォーマット整形
    function formatAIResponse(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-900">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="text-indigo-800 font-medium">$1</em>')
        .replace(/\n/g, '<br>');
    }

    // Gemini API を呼び出して分析結果を取得
    async function analyzeWithGemini(memberName, averages) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      
      let dataText = "";
      RANKS.forEach(rank => {
        if (averages[rank] != null) {
          dataText += `${rank}: ${Math.round(averages[rank]).toLocaleString()} pt\n`;
        }
      });

      const prompt = `あなたはアイドルゲーム（ユニゾンエアー）のイベントボーダーを分析する専門家です。
以下のメンバーのイベントボーダーの平均ポイントデータを元に、ボーダーの傾向（上位がどれくらい激戦か、全体的な高さなど）と、ファンに向けた次回イベントを走る際のアドバイスや応援メッセージを、150文字〜250文字程度で熱く簡潔に語ってください。
口調は親しみやすく、アイドルファンに寄り添った感じでお願いします。

対象メンバー：${memberName}
【平均ボーダーデータ】
${dataText}`;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "You are an enthusiastic and helpful assistant for idol rhythm game fans." }] }
      };

      const options = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      };

      const result = await fetchWithRetry(url, options);
      return result.candidates?.[0]?.content?.parts?.[0]?.text || "申し訳ありません、分析結果を正しく取得できませんでした。";
    }

    // メンバー選択肢のプルダウンをグループ別に生成・更新する関数
    function updateMemberSelect(filterText = "") {
      memberSelect.innerHTML = '<option value="" disabled>選択...</option>';
      let firstAvailableMember = null;
      
      const addGroup = (groupLabel, memberList) => {
        const filtered = memberList.filter(m => m.includes(filterText));
        if (filtered.length > 0) {
          const optgroup = document.createElement('optgroup');
          optgroup.label = groupLabel;
          
          filtered.forEach(member => {
            const option = document.createElement('option');
            option.value = member;
            option.textContent = member;
            optgroup.appendChild(option);
          });
          
          memberSelect.appendChild(optgroup);
          if (!firstAvailableMember) firstAvailableMember = filtered[0];
          return true;
        }
        return false;
      };

      // 現役メンバーの追加
      const hasSakuActive = addGroup("🌸 櫻坂46 (現役)", SAKURAZAKA_MEMBERS);
      const hasHinaActive = addGroup("☀️ 日向坂46 (現役)", HINATAZAKA_MEMBERS);

      // 現役と卒業生の間に視覚的な空白と区切り線を入れる
      if (hasSakuActive || hasHinaActive) {
        const spacer1 = document.createElement('option');
        spacer1.disabled = true;
        spacer1.textContent = "";
        memberSelect.appendChild(spacer1);

        const separator = document.createElement('option');
        separator.disabled = true;
        separator.textContent = "▼ 卒業生・その他 ▼";
        memberSelect.appendChild(separator);

        const spacer2 = document.createElement('option');
        spacer2.disabled = true;
        spacer2.textContent = "";
        memberSelect.appendChild(spacer2);
      }

      // 卒業生・その他メンバーの追加
      addGroup("🎓 櫻坂46 (卒業・その他)", SAKURAZAKA_GRADUATES);
      addGroup("🎓 日向坂46 (卒業・その他)", HINATAZAKA_GRADUATES);

      // 検索にヒットしたメンバーがいれば、一番上の人を選択状態にする
      if (firstAvailableMember) {
        memberSelect.value = firstAvailableMember;
        renderTable(firstAvailableMember);
      } else {
        renderTable("");
      }
    }

    // テーブルに数値を表示する関数
    function renderTable(memberName) {
      tableBody.innerHTML = "";
      const memberData = BORDER_DATA[memberName];
      currentSelectedMemberName = memberName;

      // AI分析エリアのリセット
      aiResultArea.classList.add('hidden');
      aiResultArea.innerHTML = "";
      aiLoading.classList.add('hidden');

      if (!memberData || memberData.length === 0) {
        tableContainer.classList.add('hidden');
        aiAnalysisContainer.classList.add('hidden');
        noDataMessage.classList.remove('hidden');
        currentAverages = {};
        return;
      }

      tableContainer.classList.remove('hidden');
      aiAnalysisContainer.classList.remove('hidden');
      noDataMessage.classList.add('hidden');

      const validSums = {};
      const validCounts = {};
      RANKS.forEach(r => { validSums[r] = 0; validCounts[r] = 0; });

      memberData.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-100 hover:bg-gray-50 transition-colors bg-white";
        
        const tdEvent = document.createElement('td');
        tdEvent.className = "px-4 py-3 border-r border-gray-200 font-medium text-gray-900 sticky left-0 bg-inherit shadow-[1px_0_0_0_#f3f4f6]";
        tdEvent.textContent = row.eventName;
        tr.appendChild(tdEvent);

        RANKS.forEach(rank => {
          const td = document.createElement('td');
          td.className = "px-4 py-3 border-r border-gray-100 text-right text-gray-600";
          
          const val = row[rank];
          if (val != null && !isNaN(val)) {
            td.textContent = val.toLocaleString();
            validSums[rank] += val;
            validCounts[rank]++;
          } else {
            td.innerHTML = '<span class="text-gray-300">-</span>';
          }
          tr.appendChild(td);
        });
        tableBody.appendChild(tr);
      });

      const trAvg = document.createElement('tr');
      trAvg.className = "bg-blue-50 border-t-2 border-blue-200 font-bold text-blue-900";
      
      const tdAvgTitle = document.createElement('td');
      tdAvgTitle.className = "px-4 py-4 border-r border-blue-200 sticky left-0 bg-blue-50 shadow-[1px_0_0_0_#bfdbfe]";
      tdAvgTitle.textContent = "📊 平均値";
      trAvg.appendChild(tdAvgTitle);

      currentAverages = {};
      RANKS.forEach(rank => {
        const td = document.createElement('td');
        td.className = "px-4 py-4 border-r border-blue-100 text-right";
        
        if (validCounts[rank] > 0) {
          const avg = validSums[rank] / validCounts[rank];
          currentAverages[rank] = avg;
          td.textContent = Math.round(avg).toLocaleString();
        } else {
          currentAverages[rank] = null;
          td.innerHTML = '<span class="text-blue-200">-</span>';
        }
        trAvg.appendChild(td);
      });
      tableBody.appendChild(trAvg);
    }

    // --- イベントリスナー ---
    searchInput.addEventListener('input', (e) => updateMemberSelect(e.target.value));
    memberSelect.addEventListener('change', (e) => renderTable(e.target.value));

    // AI分析ボタンのクリックイベント
    analyzeBtn.addEventListener('click', async () => {
      if (!currentSelectedMemberName || Object.keys(currentAverages).length === 0) return;

      // ローディング表示に切り替え
      aiResultArea.classList.add('hidden');
      aiResultArea.innerHTML = "";
      aiLoading.classList.remove('hidden');
      analyzeBtn.disabled = true;
      analyzeBtn.classList.add('opacity-50', 'cursor-not-allowed');

      try {
        const responseText = await analyzeWithGemini(currentSelectedMemberName, currentAverages);
        aiResultArea.innerHTML = formatAIResponse(responseText);
        aiResultArea.classList.remove('hidden');
      } catch (error) {
        console.error("AI Analysis Error:", error);
        aiResultArea.innerHTML = "<span class='text-red-500'>通信エラーが発生しました。時間をおいて再度お試しください。</span>";
        aiResultArea.classList.remove('hidden');
      } finally {
        aiLoading.classList.add('hidden');
        analyzeBtn.disabled = false;
        analyzeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });

    // --- 初期化処理 ---
    updateMemberSelect("");
    lucide.createIcons();
  </script>
