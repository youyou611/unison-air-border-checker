const searchInput = document.getElementById('searchInput');
const memberSelect = document.getElementById('memberSelect');
const tableHeader = document.getElementById('tableHeader');
const tableBody = document.getElementById('tableBody');

RANKS.forEach(r => {
  const th = document.createElement('th');
  th.textContent = r;
  tableHeader.appendChild(th);
});

const allMembers = Object.keys(BORDER_DATA).sort();

function updateSelect(filter = '') {
  memberSelect.innerHTML = '';
  const filtered = allMembers.filter(m => m.includes(filter));
  filtered.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    memberSelect.appendChild(opt);
  });
  if (filtered.length > 0) {
    memberSelect.value = filtered[0];
    render(filtered[0]);
  } else {
    render('');
  }
}

function render(memberName) {
  tableBody.innerHTML = '';
  const list = BORDER_DATA[memberName];
  if (!list) return;

  const sums = {}, counts = {};
  RANKS.forEach(r => { sums[r] = 0; counts[r] = 0; });

  list.forEach(row => {
    const tr = document.createElement('tr');
    const tdTitle = document.createElement('td');
    tdTitle.textContent = row.eventName;
    tr.appendChild(tdTitle);

    RANKS.forEach(r => {
      const td = document.createElement('td');
      const val = row[r];
      if (val != null) {
        td.textContent = val.toLocaleString();
        sums[r] += val;
        counts[r]++;
      } else {
        td.textContent = '-';
      }
      tr.appendChild(td);
    });
    tableBody.appendChild(tr);
  });

  const trAvg = document.createElement('tr');
  trAvg.className = 'avg';
  const tdAvgTitle = document.createElement('td');
  tdAvgTitle.textContent = '平均値';
  trAvg.appendChild(tdAvgTitle);

  RANKS.forEach(r => {
    const td = document.createElement('td');
    if (counts[r] > 0) {
      td.textContent = Math.round(sums[r] / counts[r]).toLocaleString();
    } else {
      td.textContent = '-';
    }
    trAvg.appendChild(td);
  });
  tableBody.appendChild(trAvg);
}

searchInput.addEventListener('input', e => updateSelect(e.target.value));
memberSelect.addEventListener('change', e => render(e.target.value));

updateSelect('');
</script>
